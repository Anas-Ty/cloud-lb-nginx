events { worker_connections 1024; }
http {
    upstream backend_cluster {
        server web1:5000 max_fails=2 fail_timeout=10s;
        server web2:5000 max_fails=2 fail_timeout=10s;
        server web3:5000 max_fails=2 fail_timeout=10s;
    }
    server {
        listen 80;
        location / { proxy_pass http://backend_cluster; }
        location /nginx_status { stub_status; allow all; }
    }
}
