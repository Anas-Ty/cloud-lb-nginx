events { worker_connections 1024; }
http {
    upstream distributed_lbs {
        server lb-zone-a:80 max_fails=1 fail_timeout=5s;
        server lb-zone-b:80 max_fails=1 fail_timeout=5s;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://distributed_lbs;
            add_header X-Edge-Router "Active";
        }
    }
}
