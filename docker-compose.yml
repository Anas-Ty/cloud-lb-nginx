services:
  web1:
    build: ./backend
    container_name: web1
    environment:
      - SERVER_NAME=Backend-Server-1
    networks:
      - cloud_net

  web2:
    build: ./backend
    container_name: web2
    environment:
      - SERVER_NAME=Backend-Server-2
    networks:
      - cloud_net

  web3:
    build: ./backend
    container_name: web3
    environment:
      - SERVER_NAME=Backend-Server-3
    networks:
      - cloud_net

  nginx-lb:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
      - web3
    networks:
      - cloud_net

networks:
  cloud_net:
    driver: bridge
